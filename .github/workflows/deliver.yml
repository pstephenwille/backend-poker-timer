name: Deliver

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Migrate database
        run: pnpm --filter @poker-timer/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pnpm sst deploy --stage dev
        env:
          SST_SECRET_GoogleClientId: ${{ secrets.GOOGLE_CLIENT_ID }}
          SST_SECRET_GoogleClientSecret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SST_SECRET_SigninCookieKey: ${{ secrets.SIGNIN_COOKIE_KEY }}
