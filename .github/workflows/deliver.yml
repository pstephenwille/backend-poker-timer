name: Deliver

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: dev
    secrets: inherit

  prod:
    needs: dev
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
    secrets: inherit
